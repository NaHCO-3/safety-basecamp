<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>안전 구조대 베이스 캠프</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #1A237E; 
            --primary-hover: #000051; 
            --text-main: #333333;
            --white: #FFFFFF;
            --o-color: #FFB3BA;
            --x-color: #BAE1FF;
            --p1-color: #FF6B6B;
            --p2-color: #4D96FF;
        }

        /* 1. 한국어 띄어쓰기 단위 줄바꿈 적용 (단어 중간에 안 잘림) */
        * { box-sizing: border-box; margin: 0; padding: 0; word-break: keep-all; }
        
        /* 2. 스크롤 전면 허용 (어떤 기기에서든 잘리면 스크롤 가능) */
        body, html { 
            font-family: 'Noto Sans KR', sans-serif; 
            background-color: #FDFDF8; 
            overflow-y: auto; /* 숨김 해제, 세로 스크롤 허용 */
            overflow-x: hidden;
            width: 100%; 
            min-height: 100vh; 
        }
        
        #app-container { width: 100%; min-height: 100vh; position: relative; display: flex; justify-content: center; align-items: center; }
        .screen { width: 100%; min-height: 100vh; position: absolute; top: 0; left: 0; display: none; flex-direction: column; padding: 20px; opacity: 0; transition: opacity 0.4s ease-in-out; overflow-y: auto; }
        .screen.active { display: flex; opacity: 1; }

        /* 홈 화면 배경 */
        #screen-home { background-image: url('background.jpg'); background-size: cover; background-position: center; background-repeat: no-repeat; display: none; justify-content: center; align-items: center; padding: 40px 10px; }
        #screen-home.active { display: flex; }
        
        /* 3. 직렬 3개 배치 유지 (wrap 금지) */
        .home-content { display: flex; flex-direction: row; justify-content: center; align-items: center; gap: 30px; width: 100%; flex-wrap: nowrap; }
        
        /* 4. 동그라미 크기 및 호버링 확대 효과 복구 */
        .menu-circle { 
            width: 340px; /* 버튼이 삐져나오지 않도록 원 크기 확대 */
            height: 340px; 
            background: rgba(255, 255, 255, 0.95); 
            border: 5px solid var(--primary-color); 
            border-radius: 50%; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            text-align: center; 
            padding: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); 
            transition: transform 0.2s ease, box-shadow 0.2s ease; /* 호버 애니메이션 추가 */
        }
        
        /* 마우스 호버 시 원 커지는 효과 복구 */
        .menu-circle:hover { transform: scale(1.05); box-shadow: 0 15px 40px rgba(26,35,126,0.4); }

        .menu-circle h2 { font-size: 2.2rem; color: var(--primary-color); font-weight: 900; margin-bottom: 10px; letter-spacing: -0.05em; text-shadow: none; }
        .menu-circle .emoji { font-size: 3rem; margin-bottom: 10px; }
        .menu-circle p { font-size: 1.1rem; color: #333; font-weight: 700; margin-bottom: 15px; }
        
        .btn { padding: 10px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; border: none; font-size: 1rem; }
        .btn-primary { background-color: var(--primary-color); color: var(--white); }
        .btn-outline { background: transparent; border: 2px solid var(--primary-color); color: var(--primary-color); }
        
        .hidden { display: none !important; }
        #modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal-box { background: white; padding: 30px; border-radius: 20px; max-width: 900px; width: 90%; max-height: 90vh; overflow-y: auto; border: 4px solid var(--primary-color); text-align: center; }

        .progress-bar-container { flex: 1; height: 12px; background-color: #e0e0e0; border-radius: 6px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background-color: var(--primary-color); transition: width 1s linear, background-color 0.3s; }
        
        .tab-header { display: flex; border-bottom: 2px solid #ddd; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 10px; cursor: pointer; text-align: center; font-weight: bold; color: gray; }
        .tab-btn.active { border-bottom: 4px solid var(--primary-color); color: var(--primary-color); }
        .tab-content { display: none; text-align: left; max-height: 40vh; overflow-y: auto; }
        .tab-content.active { display: block; }
        ul { padding-left: 20px; } li { margin-bottom: 15px; line-height: 1.4; }

        /* O/X 퀴즈 & 구조 레이스 버튼 (데스크톱 기본 디자인 유지) */
        .btn-ox { padding: 15px; font-size: 2rem; font-weight: 900; border-radius: 15px; cursor: pointer; border: none; transition: all 0.2s; }
        .btn-o { background-color: var(--o-color); color: var(--white); }
        .btn-x { background-color: var(--x-color); color: var(--white); }
        
        .btn-o:not(:disabled):hover, .btn-o:not(:disabled):active { background-color: #FF3B30 !important; transform: scale(1.05); }
        .btn-x:not(:disabled):hover, .btn-x:not(:disabled):active { background-color: #007AFF !important; transform: scale(1.05); }
        .btn-ox-race:not(:disabled):hover, .btn-ox-race.ai-hover { background-color: #000 !important; }
        .btn-ox-race#btn-ox-o:not(:disabled):hover, .btn-ox-race#btn-ox-o.ai-hover { background-color: #FF3B30 !important; color: white !important; }
        .btn-ox-race#btn-ox-x:not(:disabled):hover, .btn-ox-race#btn-ox-x.ai-hover { background-color: #007AFF !important; color: white !important; }

        /* ========================================================
           📱 태블릿 & 스마트폰 가로 모드 (직렬 유지하되 크기만 축소)
           ======================================================== */
        @media (max-width: 1024px) {
            .home-content { gap: 15px; }
            .menu-circle { width: 240px; height: 240px; padding: 10px; border-width: 4px; }
            .menu-circle h2 { font-size: 1.5rem; margin-bottom: 5px; }
            .menu-circle .emoji { font-size: 2rem; margin-bottom: 5px; }
            .menu-circle p { font-size: 0.9rem; margin-bottom: 10px; }
            .btn { padding: 8px 12px; font-size: 0.9rem; }
            .btn-group-vertical { gap: 5px !important; }
            
            /* 게임 레이아웃 조절 */
            #ui-area { width: 300px !important; }
            .btn-ox-race { padding: 10px !important; font-size: 1.5rem !important; }
        }

        /* 스마트폰 화면이 아주 좁을 때 (글씨가 버튼 밖으로 나가지 않게 최대한 축소) */
        @media (max-width: 768px), (max-height: 500px) {
            .home-content { gap: 10px; }
            .menu-circle { width: 190px; height: 190px; padding: 10px; border-width: 3px; }
            .menu-circle h2 { font-size: 1.2rem; margin-bottom: 5px; }
            .menu-circle .emoji { font-size: 1.5rem; margin-bottom: 0px; }
            .menu-circle p { display: none; /* 공간 확보를 위해 작은 설명글 숨김 */ } 
            .btn { padding: 5px 10px; font-size: 0.8rem; }
            
            /* 퀴즈 글씨/버튼 축소 */
            .quiz-question-text { font-size: 1.2rem !important; margin-bottom: 10px !important; }
            .ox-buttons { flex-direction: row !important; }
            .ox-buttons button { padding: 10px !important; font-size: 1.3rem !important; }
            
            /* 구조 레이스 */
            #race-layout { gap: 10px !important; padding: 5px !important; }
            #ui-area { width: 220px !important; }
            .race-quiz-q { font-size: 0.9rem !important; margin-bottom: 5px !important; }
        }

        /* 애니메이션 이펙트 */
        @keyframes severeShake { 0%, 100% { transform: translate(0, 0) rotate(0deg); } 20% { transform: translate(-4px, 4px) rotate(-1deg); } 40% { transform: translate(4px, -4px) rotate(1deg); } 60% { transform: translate(-4px, -4px) rotate(-1deg); } 80% { transform: translate(4px, 4px) rotate(1deg); } }
        .fx-earthquake { animation: severeShake 0.15s infinite; }
        .rock-emoji { position: absolute; font-size: 2.5rem; animation: fallDown 1.5s linear forwards; z-index: 999; }
        .dust-emoji { position: absolute; font-size: 2rem; animation: floatUp 1.5s ease-out forwards; z-index: 998; opacity: 0.8; }
        @keyframes fallDown { 0% { top: -50px; transform: rotate(0deg); } 100% { top: 110vh; transform: rotate(360deg); } }
        @keyframes floatUp { 0% { opacity: 0.8; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-100px) scale(2); } }
        .wave-container { position: fixed; top: 0; left: -100vw; width: 200vw; height: 100vh; pointer-events: none; z-index: 999; display: flex; align-items: flex-end; justify-content: space-around; font-size: 10rem; animation: waveSurge 3s ease-in-out forwards; overflow: hidden; }
        .wave-container div { margin-bottom: -30px; }
        @keyframes waveSurge { 0% { transform: translateX(0); } 100% { transform: translateX(120vw); } }
        .volcano-container { position: fixed; bottom: -20vh; left: 50%; transform: translateX(-50%); z-index: 999; text-align: center; pointer-events: none; animation: eruptPop 3s ease-out forwards; }
        @keyframes eruptPop { 0% { bottom: -50vh; } 15% { bottom: -20px; } 85% { bottom: -20px; opacity: 1; } 100% { bottom: -50vh; opacity: 0; } }
        .ash-emoji { position: absolute; font-size: 2.5rem; animation: ashFly 2.5s ease-out forwards; }
        @keyframes ashFly { 0% { top: 0; left: 50%; opacity: 1; transform: scale(1); } 100% { top: -100vh; left: calc(50% + var(--dx)); opacity: 0; transform: scale(2.5); } }
    </style>
</head>
<body>
    <div id="app-container">
        <!-- 홈 화면 -->
        <section id="screen-home" class="screen active">
            <div class="home-content">
                <div class="menu-circle">
                    <div class="emoji">🛡️</div>
                    <h2>안전 훈련소</h2>
                    <p>O/X 퀴즈 훈련</p>
                    <div class="btn-group-vertical" style="display:flex; flex-direction:column; gap:10px; width:80%;">
                        <button class="btn btn-outline" onclick="app.showModal('quiz-desc')">게임 설명</button>
                        <button class="btn btn-primary" onclick="app.startQuiz()">시작하기</button>
                    </div>
                </div>
                <div class="menu-circle">
                    <div class="emoji">🏎️</div>
                    <h2>구조 레이스</h2>
                    <p>대피로 연결 대결</p>
                    <div class="btn-group-vertical" style="display:flex; flex-direction:column; gap:10px; width:80%;">
                        <button class="btn btn-outline" onclick="app.showModal('race-desc')">게임 설명</button>
                        <button class="btn btn-primary" onclick="app.showModal('race-mode-select')">시작하기</button>
                    </div>
                </div>
                <div class="menu-circle">
                    <div class="emoji">📚</div>
                    <h2>작전 정보실</h2>
                    <p>안전 필수 자료</p>
                    <div class="btn-group-vertical" style="display:flex; flex-direction:column; gap:10px; width:80%;">
                        <a href="https://www.safekorea.go.kr/" target="_blank" class="btn btn-outline" style="text-decoration:none;">국민안전24</a>
                        <a href="https://www.youtube.com/@y_princess0106" target="_blank" class="btn btn-outline" style="text-decoration:none;">안전 영상</a>
                    </div>
                </div>
            </div>
        </section>

        <section id="screen-quiz" class="screen"><div id="quiz-container"></div></section>
        <section id="screen-race" class="screen"><div id="race-container"></div></section>
        <div id="modal-overlay" class="hidden"><div id="modal-content" class="modal-box"></div></div>
    </div>
    
    <script>
        const quizData = [
            { q: "탁자 밑에 대피할 때, 탁자 다리는 3개보다는 4개 이상이 더 안전하다.", a: "O", exp: "탁자 밑에 대피할 때, 탁자 다리의 개수가 많을수록 더 안전해요!" },
            { q: "탁자 밑에 대피할 때, 탁자 다리가 높을수록 더 안전하다.", a: "X", exp: "탁자 밑에 대피할 때, 탁자 다리가 낮을수록 더 안전해요!" },
            { q: "계단이 아닌 엘리베이터를 타고 빠르게 밖으로 대피한다.", a: "X", exp: "지진이 일어나면 무조건 계단을 이용해 대피해야 해요!" },
            { q: "지진이 일어났을 때 엘리베이터 안에 있다면, 모든 층의 버튼을 눌러야 한다.", a: "O", exp: "지진을 느끼면 모든 층의 버튼을 눌러 가장 먼저 열리는 층에서 신속히 내려 계단으로 대피해야 해요. 만약 문이 열리지 않는다면 인터폰이나 휴대전화로 구조를 요청해요!" },
            { q: "운동장이나 공원으로 대피한 후, 낮잠을 자며 휴식 시간을 가진다.", a: "X", exp: "대피한 후에는 라디오나 공공기관의 방송을 듣고 안내에 따라 행동해야 해요!" },
            { q: "물건에 깔리거나 방에 갇히면 큰 소리를 질러서 나의 위치를 알린다.", a: "X", exp: "큰 소리를 내면 금방 지치게 되기 때문에, 소리를 지르지 말고 주변의 딱딱한 물건을 이용해 갇혀 있음을 알려야 해요!" },
            { q: "건물에서 대피할 때, 밖의 상황을 잘 보기 위해 창문 쪽에 붙어서 이동한다.", a: "X", exp: "유리가 깨질 수 있기 때문에, 창문과 떨어져 이동해야 해요!" },
            { q: "버스를 타고 있는데 지진이 일어나면, 창문을 열고 바로 밖으로 뛰쳐나간다.", a: "X", exp: "버스 안에서 서 있다면 자세를 낮춰 앉고, 손잡이 등을 두 손으로 꼭 잡아야 해요. 앉아 있다면 가방으로 몸을 보호하며 자세를 낮춰야 해요!" },
            { q: "밖에서 지진을 만나면 전봇대나 가로수, 담장 등을 피해 넓은 장소로 이동한다.", a: "O", exp: "밖에서 지진을 만나면 주변 장애물을 피해서 넓은 장소로 이동해야 해요!" },
            { q: "지진이 올 때 자전거 헬멧을 쓰고 대피해도 된다.", a: "O", exp: "헬멧은 가방이나 방석보다 더 안전하기 때문에, 헬멧이 있다면 착용하는 것이 좋아요!" },
            { q: "지진으로부터 안전한 지진 옥외 대피장소는 '안전 부싯돌' 앱에서 확인할 수 있다.", a: "X", exp: "지진으로부터 안전한 지진 옥외 대피장소는 '안전 디딤돌' 앱 또는 국민 재난안전포털에서 확인할 수 있어요!" },
            { q: "마트에서 지진이 오면 쇼핑 바구니로 머리를 보호하고 자세를 최대한 낮춘다.", a: "O", exp: "마트에서는 진열장의 물건이 쏟아질 수 있기 때문에, 진열장과 멀리 떨어져서 쇼핑 바구니로 머리를 보호해야 해요!" },
            { q: "에스컬레이터를 타고 있는데 지진이 오면, 재빨리 에스컬레이터에서 내린다.", a: "X", exp: "에스컬레이터 손잡이를 꽉 잡고 앉아서 기다린 후, 침착하게 내려야 해요!" },
            { q: "재난 대비 비상식품으로는 3분 안에 빠르게 끓여 먹을 수 있는 라면이 좋다.", a: "X", exp: "가열하지 않고 먹을 수 있는 통조림이나 초코바, 생수 등이 더 좋아요!" },
            { q: "지진이 일어나면 집 안에서 운동화를 신고 다닌다.", a: "O", exp: "집 안에서도 유리나 물건 파편 조각을 밟으면 부상을 당할 수 있어요. 운동화나 바닥이 두꺼운 슬리퍼를 신고 이동해야 해요!" },
            { q: "평소, 집에서 텔레비전이나 꽃병 등 떨어질 수 있는 물건은 높은 곳에 두지 않는다.", a: "O", exp: "지진이 일어나면 물건이 떨어져서 다칠 수 있기 때문에, 낮은 곳에 두어요!" },
            { q: "극장이나 경기장에 있을 때는 서둘러 공간에서 벗어나야 한다.", a: "X", exp: "극장이나 경기장에서는 흔들림이 멈출 때까지 가방 등 소지품으로 몸을 보호하면서 자리에 있다가, 안내에 따라 침착하게 대피해야 해요!" },
            { q: "바닷가에서 지진해일 특보가 발령되면 낮은 곳으로 이동한다.", a: "X", exp: "지진해일 특보가 발령되면 즉시 높은 곳이나 튼튼한 콘크리트 건물의 3층 이상으로 이동해야 해요" },
            { q: "지진 대피 후 옷장이나 서랍장을 열 때는 주의해야 한다.", a: "O", exp: "옷장이나 서랍장의 내용물이 쏟아져 내려 부상을 입을 수도 있기 때문에, 문을 열 때 주의해야 해요!" },
            { q: "건물 밖으로 이동할 때는 가방으로 머리를 보호해야 한다.", a: "O", exp: "건물 밖에서는 유리창, 간판, 타일 등이 떨어질 위험이 매우 높기 때문에 머리를 보호하면서 걸어가야 해요." },
            { q: "화산 폭발이 일어나면 용암이 집 안에 들어올 수 있기 때문에, 야외로 대피해야 한다.", a: "X", exp: "화산재가 낙하하기 때문에 실내에 머물러야 해요!" },
            { q: "화산재 낙하에 대비하여 필요한 물품을 미리 준비해 두어야 한다.", a: "O", exp: "화산재가 계속 내리면 몇 시간, 또는 며칠간 외출을 하지 못할 수 있기 때문에, 필요한 물품은 미리미리 준비해야 해요!" },
            { q: "화산 폭발이 일어나면, 화산재가 실내에 들어오는 것을 막기 위해 문이나 창문을 닫는다.", a: "O", exp: "화산재가 실내에 들어올 수 있기 때문에, 문이나 창문을 닫고, 물을 묻힌 수건을 문의 빈틈이나 환기구에 두어야 해요!" },

                clearInterval(this.timer); const name = winner === 1 ? '구조대원 1' : (this.mode === '1P' ? 'AI' : '구조대원 2'); const color = winner === 1 ? 'var(--p1-color)' : 'var(--p2-color)';
                const overlay = document.getElementById('modal-overlay'), content = document.getElementById('modal-content');
                content.innerHTML = `<h2 style="margin-bottom:10px; font-size: 2rem;"><span style="color:${color};">${name}</span>이(가) 먼저 대피로를 연결하였습니다.</h2><h3 style="margin-bottom:30px; font-size: 1.5rem; color:var(--primary-color);">시민들이 안전하게 대피했습니다! 🚁</h3><div style="display:flex; flex-direction:column; max-width: 400px; margin: 0 auto; gap: 15px;"><button class="btn btn-primary" style="padding: 15px;" onclick="raceMode.showReview()">이번 게임에서 틀린 문제 다시 보기</button><button class="btn btn-outline" style="padding: 15px;" onclick="app.goHome()">처음으로 돌아가기</button></div>`;
                overlay.classList.remove('hidden');
            },
            showReview() {
                const overlay = document.getElementById('modal-overlay'), content = document.getElementById('modal-content');
                let p1Wrong = this.wrongList[1].map(q => `<li><strong>Q: ${q.q}</strong><br/><span style="color:var(--p1-color); font-weight:bold;">A: ${q.a}</span> <br/><span style="color:gray">${q.exp}</span></li>`).join(''), p2Wrong = this.wrongList[2].map(q => `<li><strong>Q: ${q.q}</strong><br/><span style="color:var(--p1-color); font-weight:bold;">A: ${q.a}</span> <br/><span style="color:gray">${q.exp}</span></li>`).join('');
                if (p1Wrong === '') p1Wrong = '틀린 문제가 없습니다.'; if (p2Wrong === '') p2Wrong = '틀린 문제가 없습니다.';
                content.innerHTML = `<h2 style="margin-bottom:20px; color:var(--primary-color);">오답 노트</h2><div class="tab-header"><div class="tab-btn active" onclick="raceMode.switchTab(1)" id="tab-btn-1">구조대원 1</div>${this.mode === '2P' ? `<div class="tab-btn" onclick="raceMode.switchTab(2)" id="tab-btn-2">구조대원 2</div>` : ''}</div><div class="tab-content active" id="tab-content-1"><ul>${p1Wrong}</ul></div>${this.mode === '2P' ? `<div class="tab-content" id="tab-content-2"><ul>${p2Wrong}</ul></div>` : ''}<br/><button class="btn btn-primary" style="margin: 0 auto;" onclick="app.goHome()">처음으로 돌아가기</button>`;
                overlay.classList.remove('hidden');
            },
            switchTab(player) { document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active')); document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active')); document.getElementById(`tab-btn-${player}`).classList.add('active'); document.getElementById(`tab-content-${player}`).classList.add('active'); },
            confirmExit() {
                let savedTime = this.timeLeft; clearInterval(this.timer);
                document.getElementById('modal-content').innerHTML = `<h2 style="margin-bottom: 20px; color:var(--primary-color);">정말로 게임을 종료하시겠습니까?</h2><div style="display:flex; flex-direction:column; justify-content:center; align-items:center; max-width: 300px; margin: 0 auto; gap: 15px;"><button class="btn btn-primary" style="width: 100%; padding: 15px; font-size: 1.2rem;" onclick="app.goHome()">네</button><button class="btn btn-outline" style="width: 100%; padding: 15px; font-size: 1.2rem;" onclick="raceMode.resumeGame(${savedTime})">아니오</button></div>`;
                document.getElementById('modal-overlay').classList.remove('hidden');
            },
            resumeGame(savedTime) { app.hideModal(); if (['QUIZ', 'PLACEMENT', 'SPECIAL'].includes(this.state)) { this.startTimer(savedTime, () => { if(this.state === 'QUIZ') this.handleQuizTimeout(); else if (this.state === 'SPECIAL') this.handleSpecialTimeout(); else { this.showPopup("시간 초과! 대피로를 연결할 수 없습니다."); setTimeout(() => this.nextTurn(), 2000); } }); } }
        };

        window.onload = () => { app.init(); };
    </script>
</body>
</html>
